<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Projeto - Tasca do Alfredo</title>
    <link rel="stylesheet" href="styles/document.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/expand-menu.css">
    <link rel="stylesheet" href="styles/main.css">

    <link rel="stylesheet" href="styles/loading-screen.css">

    <link rel="stylesheet" href="styles/project/project-iframe.css">
    <link rel="stylesheet" href="styles/project/project-welcome.css">
    <link rel="stylesheet" href="styles/project/project.css">
</head>

<body>
    <section class="loading-screen">
        <div class="loading-screen-content">
            <div class="loading-screen-logo">
                <img src="badge-logo-white.png" alt="">
            </div>
            <div class="loading-screen-progress-container">
                <div class="loading-screen-progress-bar">
                    <div class="loading-screen-progress-fill" id="progress-fill"></div>
                </div>
            </div>
            <div class="loading-screen-text-container">
                <p id="loading-text">Abrindo as portas...</p>
            </div>
        </div>
    </section>
    <header>
        <div id="header-pattern">
        </div>
        <section id="header-navigation">
            <a id="header-logo" href="index">
                <img src="badge-white.png" id="header-logo-badge">
                <img src="logo-white.png" id="header-logo-image">
                <p id="header-logo-since">
                    Desde 1977
                </p>
            </a>
            <div id="header-navigation-buttons">
                <a href="index" class="desktop-navigation-button">início</a>
                <a href="sobre" class="desktop-navigation-button">sobre</a>
                <a href="contato" class="desktop-navigation-button">contato</a>
                <a href="cardapio" class="desktop-navigation-button">cardápio</a>
                <a href="projeto" class="navigation-button" id="project-navigation-button">
                    <img src="shard-blue.png" alt="">
                    <span>Projeto</span>
                </a>
                <a id="project-navigation-expand">
                    <i class="fa fa-bars" aria-hidden="true"></i>
                </a>
                <div id="collapsable-menu">
                    <div id="outside-menu">

                    </div>
                    <div id="menu-container">
                        <a id="menu-close">
                            <!-- <i class="fa fa-times" aria-hidden="true"></i> -->
                            X
                        </a>
                        <div class="menu-logo">
                            <img src="badge-white.png" id="menu-logo-badge">
                            <img src="logo-white.png" id="menu-logo-image">
                        </div>
                        <ul id="mobile-nav">
                            <li class="mobile-nav-item">
                                <a href="index">
                                    <div class="nav-icon-container">
                                        <i class="fa fa-home nav-icon" aria-hidden="true"></i>
                                    </div>
                                    <p>Início</p>
                                    <i class="fa fa-caret-right nav-caret" aria-hidden="true"></i>
                                </a>
                            </li>
                            <li class="mobile-nav-item">
                                <a href="sobre">
                                    <div class="nav-icon-container">
                                        <i class="fa fa-info nav-icon-circle nav-icon" aria-hidden="true"></i>
                                    </div>
                                    <p>Sobre</p>
                                    <i class="fa fa-caret-right nav-caret" aria-hidden="true"></i>
                                </a>
                            </li>
                            <li class="mobile-nav-item">
                                <a href="contato">
                                    <div class="nav-icon-container">
                                        <i class="fa fa-envelope nav-icon" aria-hidden="true"></i>
                                    </div>
                                    <p>Contato</p>
                                    <i class="fa fa-caret-right nav-caret" aria-hidden="true"></i>
                                </a>
                            </li>
                            <li class="mobile-nav-item">
                                <a href="cardapio">
                                    <div class="nav-icon-container">
                                        <i class="fa fa-book nav-icon" aria-hidden="true"></i>
                                    </div>
                                    <p>Cardápio</p>
                                    <i class="fa fa-caret-right nav-caret" aria-hidden="true"></i>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>
    </header>
    <main>
        <section class="project-container">
            <div class="background"></div>
            <div class="project-welcome">
                <div class="project-welcome-logo">
                    <img src="badge-logo-white.png" alt="" id="project-welcome-logo">
                    <h1 id="project-welcome-title">Alma e Identidade Portuguesa</h1>
                    <p id="project-welcome-subtitle">Na contramão da padronização</p>
                </div>
                <div class="project-start-button-container">
                    <a id="project-start-button">
                        <i class="fa fa-arrow-right" aria-hidden="true"></i>
                    </a>
                </div>
            </div>
            <!-- <iframe width="100%" height="100%" frameborder="0" allow="xr-spatial-tracking; gyroscope; accelerometer"
                allowfullscreen scrolling="no"
                src="https://kuula.co/share/LvJ8Z?logo=1&info=1&fs=1&vr=0&sd=1&thumbs=1"></iframe> -->
        </section>
    </main>

</body>
<script type="module" src="app.js"></script>

</html>
